# Fork (alexandros-lekkas/t3code): builds the macOS arm64 app from boat and publishes it as a
# GitHub release of this fork. Installed fork builds read this repository's feed (baked into
# app-update.yml) and install updates themselves; see apps/desktop/src/updates/unsignedMacUpdate.ts.
# The release also carries the t3 CLI archives and SHA256SUMS, which remote servers download to
# update to the app's version (CLI_RELEASE_REPOSITORY in packages/shared/src/cliRelease.ts).
#
# Version: <next patch after upstream's version>-boat.<run number>, e.g. 0.1.11-boat.7 on top of
# upstream 0.1.10, so it sorts above the official release it is based on.
name: Fork release

on:
  push:
    branches: [boat]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
      # The sync and its checks do not change the app.
      - ".github/workflows/fork-sync.yml"
      - ".github/workflows/fork-checks.yml"
      - ".github/scripts/fork-checks.sh"
      - ".github/actions/fork-checks-setup/**"
  workflow_dispatch:

# The build runs the whole dependency tree's install scripts, so only the publish job can write.
permissions:
  contents: read

concurrency:
  group: fork-release
  cancel-in-progress: false

env:
  # The public identifiers from .env.example, as official builds use. The server bundle bakes them in.
  T3CODE_CLERK_PUBLISHABLE_KEY: pk_live_Y2xlcmsudDMuY29kZXMk
  T3CODE_CLERK_JWT_TEMPLATE: t3-relay
  T3CODE_CLERK_CLI_OAUTH_CLIENT_ID: hzxSgY2cH10sDU2r
  T3CODE_RELAY_URL: https://relay.t3.codes

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Resolve version
        id: version
        run: |
          upstream="$(curl -fsSL "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_SHA/apps/desktop/package.json" | jq -r .version)"
          base="${upstream%%-*}"
          IFS=. read -r major minor patch <<<"$base"
          version="$major.$minor.$((patch + 1))-boat.$GITHUB_RUN_NUMBER"
          echo "Upstream $upstream -> $version"
          echo "version=$version" >>"$GITHUB_OUTPUT"
    outputs:
      version: ${{ steps.version.outputs.version }}

  release:
    name: Build macOS arm64
    needs: version
    runs-on: macos-15
    timeout-minutes: 90
    env:
      # The feed baked into the build: this fork's releases, never upstream's.
      T3CODE_DESKTOP_UPDATE_REPOSITORY: ${{ github.repository }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      # Plain git, not actions/checkout: with persist-credentials false its auth cleanup runs
      # `git submodule foreach`, which dies on upstream's gitlinks that have no .gitmodules. The
      # repository is public, so no token is ever written to disk.
      - name: Checkout
        run: |
          git init --quiet .
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git fetch --quiet --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout --quiet --detach FETCH_HEAD

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=@t3tools/desktop... --filter=t3... --filter=@t3tools/scripts...

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: aarch64-apple-darwin

      - name: Build the app
        env:
          T3CODE_DESKTOP_VERSION: ${{ needs.version.outputs.version }}
        run: node scripts/build-desktop-artifact.ts --platform mac --target zip --arch arm64 --verbose

      - name: Check the artifacts
        id: artifacts
        run: |
          cd release
          ls -la
          zip="T3-Code-$VERSION-arm64.zip"
          test -f "$zip" && test -f "$zip.blockmap" && test -f latest-mac.yml
          cat latest-mac.yml
          grep -q "^version: $VERSION$" latest-mac.yml
          expected="$(awk '/^sha512:/ {print $2; exit}' latest-mac.yml)"
          actual="$(openssl dgst -sha512 -binary "$zip" | base64)"
          [[ "$expected" == "$actual" ]] || { echo "latest-mac.yml sha512 does not match $zip"; exit 1; }
          # The bundle must carry this fork's feed and the self-update flag.
          tmp="$(mktemp -d)"
          ditto -x -k "$zip" "$tmp"
          app="$(find "$tmp" -maxdepth 1 -name '*.app' -print -quit)"
          # Installed builds update in place only to the same bundle id; the name is the fork's.
          [[ "$(basename "$app")" == "T3 Code (Lekkas).app" ]] || { echo "unexpected bundle name: $app"; exit 1; }
          [[ "$(plutil -extract CFBundleIdentifier raw "$app/Contents/Info.plist")" == "com.t3tools.t3code" ]] || { echo "unexpected bundle id"; exit 1; }
          cat "$app/Contents/Resources/app-update.yml"
          grep -q "owner: ${GITHUB_REPOSITORY%%/*}" "$app/Contents/Resources/app-update.yml"
          grep -q "repo: ${GITHUB_REPOSITORY##*/}" "$app/Contents/Resources/app-update.yml"
          npx --yes @electron/asar@3.4.1 extract-file "$app/Contents/Resources/app.asar" package.json
          jq -e '.t3codeUnsignedUpdates == true' package.json
          echo "zip=$zip" >>"$GITHUB_OUTPUT"

      - name: Upload the release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fork-release
          path: |
            release/${{ steps.artifacts.outputs.zip }}
            release/${{ steps.artifacts.outputs.zip }}.blockmap
            release/latest-mac.yml
          retention-days: 7
          if-no-files-found: error

      # The desktop build left apps/server/dist (branded) and the resource monitor in place, but
      # restored the manifests, so align them again before build-exe bundles the server.
      - name: Build the CLI archive
        run: |
          node scripts/update-release-package-versions.ts "$VERSION"
          APP_VERSION="$VERSION" node apps/server/scripts/cli.ts build-exe --verbose
          mkdir -p "$RUNNER_TEMP/cli-resource-monitor/darwin-arm64"
          cp native/resource-monitor/target/aarch64-apple-darwin/release/t3-resource-monitor "$RUNNER_TEMP/cli-resource-monitor/darwin-arm64/"
          node scripts/build-cli-archive.ts --platform mac --arch arm64 --version "$VERSION" \
            --resource-monitor-dir "$RUNNER_TEMP/cli-resource-monitor" --output-dir release-cli
          node scripts/smoke-cli-archive.ts --archive release-cli/* --expect-version "$VERSION"

      - name: Upload the CLI archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fork-cli-darwin-arm64
          path: release-cli/*
          retention-days: 7
          if-no-files-found: error
          compression-level: 0
    outputs:
      zip: ${{ steps.artifacts.outputs.zip }}

  # The t3 CLI archives remote Linux servers install, built as release-desktop.yml does.
  cli_linux:
    name: Build CLI linux-${{ matrix.arch }}
    needs: version
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
            rust_target: x86_64-unknown-linux-gnu
          # node-pty compiles from source, so arm64 builds on arm64 hardware.
          - arch: arm64
            runner: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-gnu
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Checkout
        run: |
          git init --quiet .
          git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git fetch --quiet --no-tags --depth=1 origin "$GITHUB_SHA"
          git checkout --quiet --detach FETCH_HEAD

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=t3... --filter=@t3tools/scripts...

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: ${{ matrix.rust_target }}

      # The archive ships libatomic.so.1 and points t3's RUNPATH at it.
      - name: Install patchelf and libatomic
        run: sudo apt-get update && sudo apt-get install -y patchelf libatomic1

      # -boat versions use the Nightly web assets (the Boat mark), as the desktop build does (resolveDesktopBrandChannel).
      - name: Build the CLI archive
        env:
          APP_VERSION: ${{ needs.version.outputs.version }}
        run: |
          node scripts/update-release-package-versions.ts "$VERSION"
          vp run --filter t3 build
          node scripts/apply-web-brand-assets.ts nightly apps/server/dist/client
          cargo build --locked --release --manifest-path native/resource-monitor/Cargo.toml --target "${{ matrix.rust_target }}"
          mkdir -p "$RUNNER_TEMP/cli-resource-monitor/linux-${{ matrix.arch }}"
          cp "native/resource-monitor/target/${{ matrix.rust_target }}/release/t3-resource-monitor" "$RUNNER_TEMP/cli-resource-monitor/linux-${{ matrix.arch }}/"
          node apps/server/scripts/cli.ts build-exe --verbose
          node scripts/build-cli-archive.ts --platform linux --arch "${{ matrix.arch }}" --version "$VERSION" \
            --resource-monitor-dir "$RUNNER_TEMP/cli-resource-monitor" --output-dir release-cli
          node scripts/smoke-cli-archive.ts --archive release-cli/* --expect-version "$VERSION"

      - name: Upload the CLI archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fork-cli-linux-${{ matrix.arch }}
          path: release-cli/*
          retention-days: 7
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Publish the release
    needs: [version, release, cli_linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 1

      - name: Download the release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fork-release
          path: release

      - name: Download the CLI archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: fork-cli-*
          merge-multiple: true
          path: release

      # Servers verify the archive they download against this file (parseChecksums in cliRelease.ts).
      - name: Write CLI archive checksums
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          cd release
          archives=("t3-$VERSION-darwin-arm64.tar.gz" "t3-$VERSION-linux-x64.tar.gz" "t3-$VERSION-linux-arm64.tar.gz")
          sha256sum "${archives[@]}" > SHA256SUMS
          cat SHA256SUMS

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          ZIP: ${{ needs.release.outputs.zip }}
        run: |
          tag="v$VERSION"
          if ! git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            git tag "$tag" "$GITHUB_SHA"
            git push origin "refs/tags/$tag"
          fi
          cd release
          notes="$(printf 'Boat fork build of T3 Code from %s (%s).\n\nUnsigned macOS arm64 build, plus t3 server archives for macOS arm64 and Linux x64/arm64. Installed fork builds update themselves from this feed; to install by hand, unzip and move the app into /Applications.' "${GITHUB_SHA:0:10}" "$GITHUB_REF_NAME")"
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "T3 Code (Lekkas) $VERSION" \
            --notes "$notes" \
            --latest \
            "$ZIP" "$ZIP.blockmap" latest-mac.yml SHA256SUMS t3-"$VERSION"-*.tar.gz
          echo "::notice::Published https://github.com/$GITHUB_REPOSITORY/releases/tag/$tag"
